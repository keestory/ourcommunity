evidence:
  register: docs/product-specs/ourcommunity/evidence-decisions.md
  observed_facts:
  - 'E01/E02: 직접 운동 참여자, 러닝/크로스핏 후보라는 사용자 인용 전달'
  - 'E04: 우리 앱으로 이동해 지속 대화한다는 확정 방향'
  - 'E11: 참여가 커뮤니티/시설을 함께 꾸미고 키우는 애셋이 되는 비전'
  - 'E12: 채팅 원문 비공개, 독특한 활기 표현 요구'
  - 'E05: 가져온 32개 테스트는 하네스 기준선; 이후 서비스 테스트는 별도 실행'
  - 'E15: 사용자 후속 요청으로 로컬 제품 개발 승인; 연구 완료·출시 승인은 아님'
  - 'E17: 지연된 준비 질문 응답으로 러닝 우선·초기 모바일 웹 무료 검증 선택; 이후 채팅/공동 성장 및 개발 승인 유지'
  - 'E18: 휴대폰 체험 배포 승인; 컨테이너 경계와 기존 브랜치 수정·푸시 포함'
  - 'E19: 관리 작업의 기존 PR #1·Vercel 팀 확인 전달; 현재 함수 저장 구조 미호환'
  - 'E20: 관리 작업이 기존 Supabase 서울 PostgreSQL17 및 다른 제품 public 데이터 확인; 외부 지속 연결 승인 대기'
  - 'E21: a6d22bc 원격 statuses/check_runs 0 확인 전달'
  - 'E22: 2026-10-30 01:00 UTC 전용 지속 연결 승인 전달. 지정 Supabase/Vercel 범위만 적용'
  official_source_reviews_received:
  - 'E07–E10: Heylo/Wodify/SugarWOD/WebKit 공식자료를 관리 작업이 확인하여 전달'
  - 'E14/R01–R05: Clubhouse/Gather Classic/Discord/Habitica/Forest 공식 패턴 검토 전달'
  external_estimates: []
  assumptions:
  - 한국은 가정; 도시/실제 그룹/생산 플랫폼/장기 과금 미정. 초기 러닝·무료 모바일 웹 검증은 확정
  - 2D 디지털 공동 공간·비금전 기념물·검증된 기여는 신규 제안
  - 작은 그룹 억제·지연·단계화와 영구성장/최근활기 분리는 제안
  contradictions:
  - 카카오 유지·채팅 제외·운영도구 우선 가정은 사용자 E04로 폐기
  - 기능 조합 자체는 Heylo 대비 차별화 근거가 아님
  - 그룹 전환/소속감 효과와 고객 수요는 아직 검증되지 않음
  expiring_evidence:
  - 공식자료 확인 2026-10-29; 30일 경과 또는 플랫폼/정책 변경 시 재검토
