quality:
  report: docs/implementation/postgres-preview.md
  acceptance_evidence:
  - 기존 준비 문서 L1 결과는 보존; 구현 검증은 별도 기록
  - 독립 백엔드/프런트 검토 및 수정 후 재검증 완료
  - strict UI audit 오류·경고 0; 토큰/문서 링크/YAML/공백 검사 Pass
  tests:
  - 'Python97 passed: 기준79 + PostgreSQL 관련18(실제 로컬DB11/설정7)'
  - 기존 Chromium E2E9 passed + PostgreSQL 2worker 체험 E2E2 passed
  - ESLint/TypeScript/Vite build 및 strict UI audit Pass; 하네스 오류0·경고3(PG 테스트 파일 길이1/기존 제3자2)
  - 공식 Vercel Python 빌더 로컬 패키징 및 함수 설정 schema Pass; PostgreSQL Docker 빌드·API smoke Pass
  - 실제 Supabase 권한/TLS/Supavisor·Vercel 빌드/공개 URL·iPhone 실기기 미검증
  unresolved_risks:
  - 실제 고객 수요·그룹 이전·반복 사용·성장 효과 미검증
  - 생산 인증·푸시·계정 삭제/보관·소유권 이전·운영 체계 미구현
  - 공개 집계 k/지연은 시험 정책이며 익명성 보장·실데이터 공개 승인이 아님
  - 운영자 공모·공정성·부상/장애 참여·시설 변경/자산 귀속 정책 미검증
  - SQLite 단일 인스턴스/폴링의 성능·실제 모바일 기기·운영 가용성 미검증
  - SQLite 체험은 재시작 초기화·단일 worker 제한; PostgreSQL 체험은 1시간 만료·공유 상태이며 공개 호스팅/부하/가용성 검증 필요
  - PostgreSQL 만료는 접근 차단이며 물리회수는 다음 guest 생성 시; 백업 보관·엄격 삭제 시한 미확정
  - 기존 PUBLIC 권한을 runtime이 상속할 수 있어 실제 프로젝트에서 별도 검사 필요; 기존 권한 자동 회수 금지
